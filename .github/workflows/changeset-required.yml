name: Changeset required

on:
  pull_request:
    branches: [main]

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A release with no changeset produces a silent version bump and an empty
      # changelog entry. This makes that impossible rather than merely
      # discouraged.
      - name: Require a changeset for changes under src/
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^src/'; then
            if ! git diff --name-only origin/main...HEAD | grep -qE '^\.changeset/.*\.md$'; then
              echo "::error::This PR changes src/ but adds no changeset."
              echo "Run 'pnpm changeset' and commit the file."
              echo "Docs-only or tooling-only? Use 'pnpm changeset --empty'."
              exit 1
            fi
          fi
          echo "Changeset requirement satisfied."
