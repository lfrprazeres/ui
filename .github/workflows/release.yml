name: Release

on:
  push:
    branches: [main]
  # So a release can be retried without an empty commit, for instance after
  # adding a missing token.
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance. Without it, publish fails rather than silently
  # dropping the attestation.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # prepublishOnly runs build plus the rsc, package and size gates, so a
      # broken artifact cannot reach the registry.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm publish --no-git-checks
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
