name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      # Story tests run in a real browser, so the binary has to be present.
      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Story tests, including axe and keyboard
        run: pnpm test

      - name: Build the package
        run: pnpm build

      # Bundling would hoist or strip "use client" and break RSC silently, so
      # this compares the built output against source.
      - name: RSC boundary
        run: pnpm check:rsc

      - name: Package contract
        run: pnpm check:package

      - name: Size budgets
        run: pnpm check:size

      - name: Build Storybook
        run: pnpm build-storybook
